
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME is required}
      POSTGRES_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi_user -d strapi_lab"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  strapi:
    build:
      context: ./strapi-app
      dockerfile: Dockerfile

    image: lab-strapi:local
    restart: unless-stopped

    env_file:
      - ./strapi-app/.env

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME is required}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is required}
      DATABASE_SSL: "false"

    ports:
      - "127.0.0.1:1337:1337"

    volumes:
      - uploads:/opt/app/public/uploads

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    external: true
    name: lab-pgdata

  uploads:
    external: true
    name: lab-strapi-uploads

networks:
  default:
    external: true
    name: lab-strapi-network
